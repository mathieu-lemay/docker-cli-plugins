[package]
name = "docker-cli-plugins"
version = "1.0.0"
edition = "2021"
description = "A collection of Docker cli plugins"
license = "MIT"
exclude = [
  "Makefile",
]

[dependencies]
anyhow = "1.0.79"
bollard = "0.21.1"
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.12"
futures-util = "0.3.34"
log = "0.4.35"
serde_json = "1.0.154"
skim = { version = "5.9.0", default-features = false, features = ["cli"] }
tabled = "0.22.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
